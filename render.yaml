services:
  - type: web
    name: uttam-ghosh-portfolio
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_DEV_ETHEREAL
        value: "false"
      - key: NEWSLETTER_DOUBLE_OPT_IN
        value: "false"
      - key: VITE_ADMIN_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: ADMIN_NOTIFY_EMAIL
        sync: false
