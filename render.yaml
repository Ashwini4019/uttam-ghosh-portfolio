services:
  - type: web
    name: uttam-ghosh-portfolio
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: ENABLE_DEV_ETHEREAL
        value: "false"
      - key: NEWSLETTER_DOUBLE_OPT_IN
        value: "false"
      - key: VITE_ADMIN_PASSWORD
        value: uttam-admin
      - key: ADMIN_PASSWORD
        value: uttam-admin
